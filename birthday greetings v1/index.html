<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy birthday babeee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="birthday-container">
        <div class="header">
            <h1>happy birthday & anniversary babeeee<span class="heart"></span></h1>
            <div class="cake-icon">🎂</div>
        </div>
        
        <div class="content">
            <div class="photo-frame">
                <img src="WhatsApp Image 2025-04-30 at 22.22.32_f02eb5a5.jpg" alt="Foto Pacar" id="birthdayPhoto">
            </div>
            
            <div class="message-container" id="messageContainer">
                <!-- Pesan-pesan akan diisi oleh JavaScript -->
            </div>
            
            <div class="music-player">
                <button class="music-btn" id="musicBtn">🎵</button>
                <div class="music-info" id="musicInfo">Putar Musik</div>
                <audio id="birthdayMusic" loop>
                    <source src="Selamat Ulang Tahun [Jamrud].mp3" type="audio/mpeg">
                    Browser tidak mendukung audio.
                </audio>
            </div>
        </div>
        
        <div class="floating-hearts" id="floatingHearts"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
